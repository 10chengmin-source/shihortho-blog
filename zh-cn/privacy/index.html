    <script>
  (function(){
    if (window.ADAPTIVE_READING_DISABLED) return;
    try {
      var root = document.documentElement;
      var choice = localStorage.getItem('shihortho:reading-mode') || 'auto';
      var colorMode, level;
      if (choice === 'readability') {
        colorMode = 'light'; level = '3';
      } else if (choice === 'dark') {
        colorMode = 'dark'; level = '0';
      } else {
        var mm = window.matchMedia ? window.matchMedia.bind(window) : null;
        colorMode = (mm && mm('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        var score = 0;
        var zoomFlag = localStorage.getItem('shihortho:zoom-flag') || 'none';
        if (zoomFlag === 'high') score += 2.5;
        else if (zoomFlag === 'mild') score += 1.5;
        if (mm && mm('(prefers-reduced-motion: reduce)').matches) score += 0.5;
        if (window.innerWidth && window.innerWidth <= 360) score += 0.25;
        var probe = document.createElement('span');
        probe.textContent = 'M';
        probe.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:-9999px;font-size:1rem;';
        root.appendChild(probe);
        var px = parseFloat(getComputedStyle(probe).fontSize) || 16;
        root.removeChild(probe);
        if (px >= 19) score += 2; else if (px >= 17.5) score += 1;
        level = score >= 3 ? '3' : score >= 2 ? '2' : score >= 1 ? '1' : '0';
      }
      root.setAttribute('data-color-mode', colorMode);
      root.setAttribute('data-reading-level', level);
      root.setAttribute('data-reading-choice', choice);
    } catch (e) {}
  })();
  </script>
