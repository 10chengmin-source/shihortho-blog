    <script>
  (function(){
    if (window.ADAPTIVE_READING_DISABLED) return;
    try {
      var root = document.documentElement;
      var choice = localStorage.getItem('shihortho:reading-mode') || 'auto';
      var colorMode, level;
      if (choice === 'readability') {
        colorMode = 'light'; level = '3';
      } else if (choice === 'dark') {
        colorMode = 'dark'; level = '0';
      } else {
        var mm = window.matchMedia ? window.matchMedia.bind(window) : null;
        colorMode = (mm && mm('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        level = '0';
      }
      root.setAttribute('data-color-mode', colorMode);
      root.setAttribute('data-reading-level', level);
      root.setAttribute('data-reading-choice', choice);
    } catch (e) {}
  })();
  </script>
